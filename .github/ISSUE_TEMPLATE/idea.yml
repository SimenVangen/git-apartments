name: An idea
description: A new detail, character or way to use the building.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What the building should show, and what activity should cause it.
    validations:
      required: true
  - type: textarea
    id: sketch
    attributes:
      label: A sketch
      description: Pixel sketches, references or mockups, if you have them.
